# Kutria V4 - Docker Compose aligned with AppHost.cs (Aspire logic)
# Best Practice: 1 DB at a time, like Aspire does: if (useSqlServer) else postgres
# .env controls DB_PROVIDER and VECTOR_PROVIDER (same as AppHost.cs)
# Default: DB_PROVIDER=PostgreSQL, VECTOR_PROVIDER=Qdrant

x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_ENVIRONMENT: Development
  Database__Provider: ${DB_PROVIDER:-PostgreSQL}
  Queue__Provider: RabbitMQ
  Vector__Provider: ${VECTOR_PROVIDER:-Qdrant}
  DataIngestion__DispatchIntervalMinutes: "15"
  Brain__RawPath: /var/commerce/brains-raw
  ConnectionStrings__Redis: commerce.cache:6379
  ConnectionStrings__RabbitMQ: amqp://guest:guest@commerce.rabbitmq:5672
  ConnectionStrings__Qdrant: http://commerce.qdrant:6334
  ConnectionStrings__AzureTables: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://commerce.azurite:10000/devstoreaccount1;QueueEndpoint=http://commerce.azurite:10001/devstoreaccount1;TableEndpoint=http://commerce.azurite:10002/devstoreaccount1;"
  AzureSearch__Endpoint: ${AzureSearch__Endpoint:-}
  AzureSearch__ApiKey: ${AzureSearch__ApiKey:-}

services:
  # --- INFRA: Mutually exclusive DBs via profiles (like Aspire if/else) ---
  commerce.db:
    image: postgres:16-alpine
    profiles: ["postgres"] # default, like Aspire fallback
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
    ports:
      - "5433:5432"
    volumes:
      - commerce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      retries: 10

  commerce.sql:
    image: mcr.microsoft.com/azure-sql-edge
    profiles: ["sqlserver"] # only when DB_PROVIDER=SqlServer
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Your_password123", "-Q", "SELECT 1", "-C"]
      interval: 10s
      retries: 10

  commerce.cache:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  commerce.rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5693:5672"
      - "15683:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      retries: 12

  commerce.qdrant:
    image: qdrant/qdrant:v1.13.4
    profiles: ["qdrant", "postgres", "sqlserver"] # default vector
    ports:
      - "6333:6333"
      - "6334:6334"

  commerce.azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    # Always on, like AppHost.cs (needed for AzureTables connection)
    command: "azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data

  # --- APPS: Uniform settings (appsettings.json global) ---
  commerce.api:
    build:
      context: .
      dockerfile: src/Commerce.Api/Dockerfile
    ports:
      - "5050:5000"
    env_file:
      - .env
    environment:
      <<: *common-env
      # Override connection string per provider (Aspire style: WithReference(db))
      ConnectionStrings__Commerce: ${ConnectionStrings__Commerce:-Host=commerce.db;Port=5432;Database=commerce;Username=commerce;Password=commerce}
    depends_on:
      commerce.cache:
        condition: service_healthy
      commerce.rabbitmq:
        condition: service_healthy
    volumes:
      - ./data/brains-raw:/var/commerce/brains-raw

  commerce.worker:
    build:
      context: .
      dockerfile: src/Commerce.Worker/Dockerfile
    env_file:
      - .env
    environment:
      <<: *common-env
      ConnectionStrings__Commerce: ${ConnectionStrings__Commerce:-Host=commerce.db;Port=5432;Database=commerce;Username=commerce;Password=commerce}
    depends_on:
      commerce.cache:
        condition: service_healthy
      commerce.rabbitmq:
        condition: service_healthy
    volumes:
      - ./data/brains-raw:/var/commerce/brains-raw

  commerce.mcp:
    build:
      context: .
      dockerfile: src/Commerce.Mcp/Dockerfile
    ports:
      - "5055:5000" # same as AppHost.cs (5055, not 5051)
    env_file:
      - .env
    environment:
      <<: *common-env
      ConnectionStrings__Commerce: ${ConnectionStrings__Commerce:-Host=commerce.db;Port=5432;Database=commerce;Username=commerce;Password=commerce}
      Mcp__PublicBaseUrl: http://localhost:5055
      Mcp__FrontendBaseUrl: http://localhost:3000
    depends_on:
      commerce.cache:
        condition: service_healthy

  commerce.shop:
    build:
      context: .
      dockerfile: src/Commerce.Shop/Dockerfile
    ports:
      - "5052:5000"
    env_file:
      - .env
    environment:
      <<: *common-env
      ConnectionStrings__Commerce: ${ConnectionStrings__Commerce:-Host=commerce.db;Port=5432;Database=commerce;Username=commerce;Password=commerce}
    depends_on:
      commerce.cache:
        condition: service_healthy

  commerce.web:
    build:
      context: .
      dockerfile: src/Commerce.Web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - commerce.api

volumes:
  commerce_pgdata:
  commerce_pgdata_sql:
  azurite_data:
