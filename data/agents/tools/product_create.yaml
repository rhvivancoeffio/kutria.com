name: product_create
description: >
  Crea un producto en Gravity Headless (POST /Products). No hidrata vectores ni índices.
mcp: true
timeout_ms: 10000
side_effect: true
input_schema:
  type: object
  properties:
    title: { type: string }
    description: { type: string }
    brand_id: { type: string }
    brand_name: { type: string }
    category_id: { type: string }
    category_path: { type: string }
    image_url: { type: string }
  required: [title]
